<svg width="1200" height="2500" viewBox="0 0 1200 2500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="2500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#04040E"/>
      <stop offset="0.45" stop-color="#0A0A1A"/>
      <stop offset="1" stop-color="#13061C"/>
    </linearGradient>

    <linearGradient id="neonLine" x1="80" y1="0" x2="1120" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F7FF"/>
      <stop offset="0.5" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#FF1FBF"/>
    </linearGradient>

    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#00E5FF" stroke-opacity="0.09" stroke-width="1" fill="none"/>
    </pattern>

    <style>
      .mono { font-family: "Courier New", "DejaVu Sans Mono", monospace; }
      .tiny { font-size: 15px; letter-spacing: 1.6px; }
      .small { font-size: 18px; letter-spacing: 1.8px; }
      .body  { font-size: 24px; letter-spacing: 0.3px; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: 3px; }
      .muted { fill: #A8B1D1; }
      .cyan  { fill: #00F7FF; }
      .pink  { fill: #FF3BC7; }
      .lime  { fill: #7BFFB3; }
      .white { fill: #F2F5FF; }
      .panelTitle { font-size: 28px; letter-spacing: 3px; font-weight: 700; }
      .quote { font-size: 30px; letter-spacing: 0.6px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1200" height="2500" rx="26" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="2497" rx="24.5" stroke="#00F7FF" stroke-opacity="0.25" stroke-width="3"/>
  <rect width="1200" height="2500" rx="26" fill="url(#grid)"/>

  <!-- Top system info -->
  <text x="60" y="62" class="mono tiny cyan">GOARB://PROFILE_PANEL_V2</text>
  <text x="1140" y="62" text-anchor="end" class="mono tiny pink">STATUS://ONLINE</text>
  <rect x="60" y="84" width="1080" height="4" rx="2" fill="url(#neonLine)" filter="url(#glowSoft)"/>

  <!-- Typing banner card -->
  <rect x="80" y="120" width="1040" height="120" rx="18" fill="#0A1022" fill-opacity="0.78" stroke="#00F7FF" stroke-opacity="0.42" stroke-width="2"/>
  <text x="110" y="154" class="mono small cyan">// boot_sequence</text>
  <image href="https://readme-typing-svg.demolab.com?font=Fira+Code&amp;weight=600&amp;size=24&amp;pause=1000&amp;color=00C2FF&amp;center=true&amp;vCenter=true&amp;width=820&amp;lines=Developer+in+progress...;Learning+something+new+every+day;Turning+coffee+into+code+%E2%98%95"
         x="150" y="165" width="820" height="42" preserveAspectRatio="xMidYMid meet"/>
  <text x="1040" y="209" class="mono tiny muted" text-anchor="end">dynamic svg</text>

  <!-- Intro -->
  <rect x="80" y="275" width="1040" height="155" rx="18" fill="#0B0B1A" fill-opacity="0.82" stroke="#FF1FBF" stroke-opacity="0.40" stroke-width="2"/>
  <text x="110" y="325" class="mono body white">👋 Goar Bosque here!</text>
  <text x="110" y="372" class="mono body white">💻 Actually studying Development at ITB (Barcelona)</text>
  <text x="110" y="419" class="mono body white">📍 Based in Sant Quirze del Vallès.</text>

  <!-- LIFE.EXE -->
  <text x="80" y="505" class="mono panelTitle cyan">// 🎬 LIFE.EXE</text>
  <rect x="80" y="530" width="1040" height="430" rx="22" fill="#08101C" fill-opacity="0.82" stroke="#00F7FF" stroke-opacity="0.42" stroke-width="2"/>
  <image href="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExcnJkOXR5NXA0cmJkb2QwdGU3ZWQ4dmx1ZDI2Y3o0OWJ2NmlzdDhvMiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/W3keANaGsQLC5Ri8DM/giphy.gif"
         x="135" y="585" width="930" height="305" preserveAspectRatio="xMidYMid slice"/>
  <text x="110" y="935" class="mono tiny muted">life.exe // animated panel</text>

  <!-- CURRENTLY -->
  <text x="80" y="1040" class="mono panelTitle pink">// 🚀 CURRENTLY</text>
  <rect x="80" y="1065" width="1040" height="255" rx="22" fill="#140919" fill-opacity="0.80" stroke="#FF1FBF" stroke-opacity="0.44" stroke-width="2"/>
  <text x="115" y="1127" class="mono body white">🎓 Studying Development at ITB — Barcelona</text>
  <text x="115" y="1183" class="mono body white">💻 Learning Software Development</text>
  <text x="115" y="1239" class="mono body white">🧠 Improving my programming skills every day</text>
  <text x="115" y="1295" class="mono body white">🛠️ Always learning something new</text>

  <!-- DEVELOPER MODE -->
  <text x="80" y="1410" class="mono panelTitle cyan">// 👾 DEVELOPER_MODE</text>
  <rect x="80" y="1435" width="1040" height="430" rx="22" fill="#0A101B" fill-opacity="0.82" stroke="#00F7FF" stroke-opacity="0.42" stroke-width="2"/>
  <image href="https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExdHM0bDlweWhxN2VoeDZ0M3ZxMGhmbDVmaGI5YmJwMGcyOGpoZzlncSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/zOvBKUUEERdNm/giphy.gif"
         x="135" y="1490" width="930" height="305" preserveAspectRatio="xMidYMid slice"/>
  <text x="110" y="1840" class="mono tiny muted">developer_mode // animated panel</text>

  <!-- Philosophy -->
  <text x="80" y="1930" class="mono panelTitle pink">// 🧠 PHILOSOPHY</text>
  <rect x="80" y="1955" width="1040" height="215" rx="22" fill="#130818" fill-opacity="0.82" stroke="#FF1FBF" stroke-opacity="0.44" stroke-width="2"/>
  <text x="600" y="2038" text-anchor="middle" class="mono quote cyan">while(alive) { learn(); code(); improve(); }</text>
  <text x="600" y="2104" text-anchor="middle" class="mono body white">💡 Learn → ⚙️ Build → 🐛 Break things → 🔧 Fix them → 🚀 Improve</text>

  <!-- Meanwhile -->
  <text x="80" y="2260" class="mono panelTitle cyan">// ☕ MEANWHILE...</text>
  <rect x="80" y="2285" width="1040" height="155" rx="22" fill="#09101C" fill-opacity="0.82" stroke="#00F7FF" stroke-opacity="0.42" stroke-width="2"/>
  <text x="110" y="2348" class="mono body white">Thanks for visiting my profile! 👾</text>
  <text x="110" y="2403" class="mono body lime">⌨️ Code. Learn. Repeat.</text>

  <rect x="80" y="2458" width="1040" height="4" rx="2" fill="url(#neonLine)" filter="url(#glowSoft)"/>
</svg>
