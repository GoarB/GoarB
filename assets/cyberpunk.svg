<svg width="1200" height="430" viewBox="0 0 1200 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050510"/>
      <stop offset="0.55" stop-color="#0A0A1B"/>
      <stop offset="1" stop-color="#12051A"/>
    </linearGradient>

    <linearGradient id="neon" x1="170" y1="150" x2="990" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F7FF"/>
      <stop offset="0.48" stop-color="#A100FF"/>
      <stop offset="1" stop-color="#FF1FBF"/>
    </linearGradient>

    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#00E5FF" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>

    <style>
      .mono { font-family: "Courier New", "DejaVu Sans Mono", monospace; }
      .small { font-size: 16px; letter-spacing: 2px; }
      .tag { font-size: 15px; letter-spacing: 1.5px; }
      .blink { animation: blink 1.2s steps(2, start) infinite; }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="428" rx="17" stroke="#00F7FF" stroke-opacity="0.28" stroke-width="2"/>
  <rect width="1200" height="430" rx="18" fill="url(#grid)"/>

  <!-- Horizon glow -->
  <rect x="0" y="320" width="1200" height="2" fill="#FF1FBF" opacity="0.45" filter="url(#softGlow)"/>
  <path d="M0 430 L315 320 M150 430 L380 320 M300 430 L450 320 M450 430 L520 320 M600 430 L600 320 M750 430 L680 320 M900 430 L750 320 M1050 430 L820 320 M1200 430 L885 320"
        stroke="#A100FF" stroke-opacity="0.23" stroke-width="1.4"/>

  <!-- Top labels -->
  <text x="48" y="54" class="mono small" fill="#00F7FF" opacity="0.92">SANT_QUIRZE.SECTOR_BCN</text>
  <text x="1150" y="54" text-anchor="end" class="mono small" fill="#FF1FBF" opacity="0.92">SYSTEM://ONLINE</text>

  <!-- Accent rails -->
  <rect x="48" y="85" width="280" height="3" fill="#00F7FF" class="pulse"/>
  <rect x="872" y="85" width="280" height="3" fill="#FF1FBF" class="pulse"/>

  <!-- Name glitch layers -->
  <text x="598" y="190" text-anchor="middle" class="mono" font-size="74" font-weight="700"
        fill="#FF1FBF" opacity="0.38" transform="translate(5,-2)">GOAR_BOSQUE</text>
  <text x="598" y="190" text-anchor="middle" class="mono" font-size="74" font-weight="700"
        fill="#00F7FF" opacity="0.42" transform="translate(-5,2)">GOAR_BOSQUE</text>
  <text x="598" y="190" text-anchor="middle" class="mono" font-size="74" font-weight="700"
        fill="url(#neon)" filter="url(#cyanGlow)">GOAR_BOSQUE</text>

  <text x="600" y="235" text-anchor="middle" class="mono" font-size="24" letter-spacing="4"
        fill="#F2F5FF">// DEVELOPMENT.STUDENT.exe</text>

  <!-- Tags -->
  <g class="mono tag">
    <rect x="300" y="270" width="135" height="34" rx="5" fill="#00F7FF" fill-opacity="0.06" stroke="#00F7FF" stroke-opacity="0.65"/>
    <text x="367.5" y="292" text-anchor="middle" fill="#00F7FF">[ JAVA ]</text>

    <rect x="450" y="270" width="135" height="34" rx="5" fill="#A100FF" fill-opacity="0.07" stroke="#A100FF" stroke-opacity="0.75"/>
    <text x="517.5" y="292" text-anchor="middle" fill="#D47AFF">[ PYTHON ]</text>

    <rect x="600" y="270" width="135" height="34" rx="5" fill="#FF1FBF" fill-opacity="0.07" stroke="#FF1FBF" stroke-opacity="0.75"/>
    <text x="667.5" y="292" text-anchor="middle" fill="#FF73D5">[ GIT ]</text>

    <rect x="750" y="270" width="135" height="34" rx="5" fill="#00F7FF" fill-opacity="0.06" stroke="#00F7FF" stroke-opacity="0.65"/>
    <text x="817.5" y="292" text-anchor="middle" fill="#00F7FF">[ LINUX ]</text>
  </g>

  <!-- Status line -->
  <circle cx="354" cy="355" r="6" fill="#00FF9C" filter="url(#softGlow)"/>
  <text x="374" y="361" class="mono" font-size="17" letter-spacing="2" fill="#B8FFD9">
    JACKED IN · DEV MODE ACTIVE · LEARNING
  </text>

  <text x="1148" y="395" text-anchor="end" class="mono" font-size="14" letter-spacing="1.5" fill="#6D7390">
    BUILD // BREAK // FIX // IMPROVE
  </text>

  <rect x="48" y="382" width="8" height="18" fill="#00F7FF" class="blink"/>
</svg>
